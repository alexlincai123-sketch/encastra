[toolchain]
# Pinned so a component built here is built the same way in CI and on a contributor's machine.
# wasm32-wasip2 is the SDK target: it emits a WebAssembly *component* directly, which is why
# cargo-component is not used (it is being deprecated — see docs/adr/0001).
channel = "1.98.1"
components = ["rustfmt", "clippy"]
targets = ["wasm32-wasip2"]
profile = "minimal"
