name: Windows release toolchain
description: >-
  The one recipe every job that produces release bytes sets up with: Node from .nvmrc, the npm
  lockfile, Rust 1.98.1, and the pinned MSVC toolset.

# Since 0.5.0-rc.5 the published artefacts are the ones a hosted runner builds (candidate.yml),
# and the release workflow builds them a second time on another runner and requires the same
# bytes. That comparison means something only if both jobs set up the same tools, so the setup
# lives here once instead of being copied into each workflow and left to drift.
#
# No build cache, anywhere this is used: the Actions cache is shared with pull-request runs, and a
# compiled artefact planted by one of those would be linked into a release without anything
# noticing. A release is built from nothing but the source and the pinned toolchain.

runs:
  using: composite
  steps:
    # The exact Node the published bytes are built with, not the latest of a line: the frontend
    # bundle is embedded in the executable, so the tool that produces it is part of the recipe.
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version-file: .nvmrc
    - name: npm ci
      shell: bash
      run: npm ci

    - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09-03
      with:
        toolchain: '1.98.1'

    # The C toolchain, which rustc does not pin and which decided B7.
    - uses: ./.github/actions/msvc-toolset
