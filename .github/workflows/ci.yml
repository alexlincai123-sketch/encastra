name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  typescript:
    name: TypeScript — lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        # Covers the packages *and* the desktop application. The desktop app had its own
        # typecheck script that nothing called, so a type error in the whole editor passed CI.
        run: npm run typecheck
      - name: Tests
        run: npm run test
      - name: Frontend production build
        run: npm run build
      - name: The conformance matrix must be committed up to date
        # Regenerating must produce no diff. If it does, the type rules changed without the
        # fixture being refreshed, and the Rust job below would be checking a stale contract.
        run: |
          UPDATE_MATRIX=1 npx vitest run --silent
          git diff --exit-code -- packages/protocol/data/compat-matrix.json

  rust:
    name: Rust — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5

      - name: Tauri's Linux dependencies
        # The workspace contains the desktop application, which links against the system
        # webview. Without these the Linux job fails to build a crate that has nothing wrong
        # with it.
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Kept in step with rust-toolchain.toml; the pin is what makes builds reproducible.
          toolchain: '1.98.1'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (includes the editor/runtime conformance gate)
        run: cargo test --workspace

  supply-chain:
    name: Supply chain — advisories and licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: npm advisories
        # An advisory fails the build. It does not open a ticket nobody reads.
        run: npm audit --audit-level=high
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.98.1'
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
