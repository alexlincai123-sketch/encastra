[package]
name = "encastra-desktop"
description = "The Encastra desktop application."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# Tauri 2 splits the app into a library plus a thin binary so the same code can be reached from
# mobile targets and from integration tests.
name = "encastra_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
encastra-builtins = { path = "../../../crates/encastra-builtins" }
encastra-core = { path = "../../../crates/encastra-core" }
encastra-library = { path = "../../../crates/encastra-library" }
encastra-project = { path = "../../../crates/encastra-project" }
encastra-protocol = { path = "../../../crates/encastra-protocol" }
encastra-publish = { path = "../../../crates/encastra-publish" }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = { workspace = true }

[dev-dependencies]
# `tauri::test` — `mock_builder`/`mock_app` — is what lets a test hold a real `tauri::State`
# and so call the commands themselves rather than the helpers underneath them. `State` has no
# public constructor; the only way to one is a built `App` that manages the value. Without it
# the purpose constant each command pins (`FolderPurpose::PublishInto` in `prepare_publication`,
# `ImportFrom` in `chosen_publication_folder`) is asserted nowhere, and inverting one breaks no
# test.
#
# A dev-dependency, so the shipped binary does not gain the feature: the workspace is on
# resolver 3, under which a dev-dependency's features are unified only when building a target
# that needs them (tests, examples, benches). `cargo build -p encastra-desktop --lib -v`
# compiles `tauri` without `--cfg feature="test"`; `cargo test` compiles a second copy with it.
tauri = { version = "2", features = ["test"] }
